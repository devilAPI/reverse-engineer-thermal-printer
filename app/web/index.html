<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Driverless photo printing for cheap ESC/POS thermal printers">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Thermal Photo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Thermal Photo – print photos on cheap thermal printers</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // GitHub Pages lets browsers cache index.html for 10 minutes; reload once
    // onto the deployed build. CI fills in the build number
    // (tool/web_cache_bust.sh); local builds skip the check.
    (function () {
      const build = '__BUILD_NUMBER__';
      if (!/^[0-9]+$/.test(build)) return;
      fetch('version.json', { cache: 'no-store' })
        .then((r) => r.json())
        .then((v) => {
          const live = String(v.build_number);
          let tried = null;
          try { tried = sessionStorage.getItem('reloadedFor'); } catch (_) {}
          if (live === build || tried === live) return;
          try { sessionStorage.setItem('reloadedFor', live); } catch (_) {}
          location.reload();
        })
        .catch(() => {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
