name: Dev build & release

# Every push to master: test, build the app
# (Android / Linux / Windows / macOS / iOS / web) and publish a prerelease tagged
# dev-<run number> (dev-1, dev-2, ...). Can also be started by hand from the
# Actions tab.
#
# Builds run alongside the tests; only the release waits for both, so nothing
# untested is published. The web build goes to GitHub Pages (/dev/) as soon
# as it and the app tests are done, without waiting for the other builds.
#
# Optional repository settings (Settings -> Secrets and variables -> Actions):
#   secret   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (release.jks).
#   secret   ANDROID_KEYSTORE_PASSWORD  keystore password.
#   secret   ANDROID_KEY_ALIAS          key alias inside the keystore.
#   secret   ANDROID_KEY_PASSWORD       key password.
#                      Without ANDROID_KEYSTORE_BASE64 the Android APK is signed
#                      with a debug key (and the release notes say so).
#
# Required: Settings -> Pages -> Source: "GitHub Actions" (web deploy).

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push cancels the running build, so a release always tags the newest
# commit of master. (github.token gets HTTP 403 tagging an older commit whose
# workflow files differ from master's.)
concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

env:
  FLUTTER_VERSION: "3.35.6"  # keep in sync with local dev SDK
  TAG: dev-${{ github.run_number }}
  # Android versionCode. Do not rename/recreate this workflow: run_number would
  # restart and new builds would count as downgrades.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test-app:
    name: Test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter test --platform chrome

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    outputs:
      signed_with: ${{ steps.build.outputs.signed_with }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            # key.properties is a Java properties file: a backslash in a value
            # starts an escape, so double every backslash.
            {
              printf 'storeFile=release.jks\n'
              printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD//\\/\\\\}"
              printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
              printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
            } > android/key.properties
            echo "signed_with=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: signing with the debug key"
            echo "signed_with=debug" >> "$GITHUB_OUTPUT"
          fi
          flutter pub get
          flutter build apk --release --build-number="$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/thermal-photo-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: app/dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cached: a slow Ubuntu mirror once held this step up for 12 minutes
      - name: Install Linux build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb libusb-1.0-0
          version: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build bundle
        run: |
          flutter pub get
          # end-to-end test of the real Linux app (no hardware: dump transport)
          THERMAL_PHOTO_DUMP="$RUNNER_TEMP/job.bin" xvfb-run -a flutter test integration_test -d linux
          flutter build linux --release --build-number="$BUILD_NUMBER"
          mkdir -p dist
          tar -czf "dist/thermal-photo-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: app/dist/*
          if-no-files-found: error

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web app
        run: |
          # base href stays "/"; the Pages workflow rewrites it for its sub-path
          flutter pub get
          flutter build web --wasm --release --build-number="$BUILD_NUMBER"
          ../tool/web_cache_bust.sh build/web "$BUILD_NUMBER"
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/thermal-photo-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: app/dist/*
          if-no-files-found: error

  web-e2e:
    name: Web e2e (Chromium, Firefox, WebKit)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: app/dist
      - name: Install Playwright
        working-directory: tools
        run: |
          npm init -y > /dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/tools/node_modules
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p build/web "$site/reverse-engineer-thermal-printer"
          unzip -q dist/*-web.zip -d build/web
          # copy as GitHub Pages serves it (the bridge proxies this path)
          cp -r build/web/. "$site/reverse-engineer-thermal-printer/"
          sed -i 's|<base href="/">|<base href="/reverse-engineer-thermal-printer/">|' "$site/reverse-engineer-thermal-printer/index.html"
          (cd build/web && python3 -m http.server 8099 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (cd "$site" && python3 -m http.server 8098 --bind 127.0.0.1 > /dev/null 2>&1 &)
          flutter pub get
          BRIDGE_E2E_SECONDS=900 THERMAL_PHOTO_DUMP="$RUNNER_TEMP/job.bin" THERMAL_PHOTO_WEB_UPSTREAM=http://127.0.0.1:8098 \
            flutter test test/bridge_test.dart --plain-name 'e2e harness' > "$RUNNER_TEMP/bridge.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:9632/v1/printers && break; sleep 1; done
          curl -sf http://127.0.0.1:9632/v1/printers
          node ../tools/web_e2e.mjs http://localhost:8099/ chromium --mock-devices
          node ../tools/web_e2e.mjs http://localhost:8099/ chromium firefox webkit
          node ../tools/web_e2e.mjs http://127.0.0.1:9632/ chromium firefox webkit
          node ../tools/web_e2e.mjs https://devilapi.github.io/ --serve-as=build/web firefox webkit
          test -s "$RUNNER_TEMP/job.bin"

  build-windows:
    name: Build Windows
    # Flutter 3.35 does not know the Visual Studio on windows-latest yet
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        run: |
          flutter pub get
          # real Win32 FFI checks (SetupAPI enumeration, overlapped I/O, timeouts)
          flutter test test_windows
          flutter build windows --release --build-number="$BUILD_NUMBER"
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/app/dist/thermal-photo-${TAG}-windows-x64.zip" . > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: app/dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app (no code signing)
        run: |
          flutter pub get
          flutter build macos --release --build-number="$BUILD_NUMBER"
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/thermal_photo.app "dist/thermal-photo-${TAG}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: app/dist/*
          if-no-files-found: error

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app (no code signing)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/thermal-photo-${TAG}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: app/dist/*
          if-no-files-found: error

  deploy-web:
    name: Deploy web to /dev/
    needs: [test-app, build-web]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      dev_web_artifact: dist-web

  release:
    name: Publish ${{ github.run_number }} as dev-${{ github.run_number }}
    needs: [test-app, build-android, build-linux, build-web, web-e2e, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create prerelease
        env:
          # untrusted text: only ever read through the environment
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SIGNED_WITH: ${{ needs.build-android.outputs.signed_with }}
        run: |
          short="${GITHUB_SHA::7}"
          if [ "$SIGNED_WITH" = release ]; then
            android="The Android APK is signed with the release key."
          else
            android="The Android APK is signed with a DEBUG key: add the ANDROID_KEYSTORE_* secrets. Users must uninstall debug-signed builds before installing release-signed ones."
          fi
          notes="Development build ${BUILD_NUMBER} of commit ${short}. Not for production.
          ${android}
          The macOS app is unsigned: right-click -> Open the first time.
          The iOS .ipa is unsigned: sideload it (AltStore, Sideloadly, ...). iOS prints over Bluetooth LE only.

          ${COMMIT_MSG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of the same workflow run: replace the files and the notes
            # (the signing may differ from the first attempt)
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Dev build ${BUILD_NUMBER} (${short})" \
              --notes "$notes"
          fi
